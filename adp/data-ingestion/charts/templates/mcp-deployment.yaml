{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-ingestion-mcp
  labels:
    app.kubernetes.io/name: data-ingestion-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: data-ingestion-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-ingestion-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: data-ingestion-mcp
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.mcp_server"]
          ports:
            - name: mcp
              containerPort: {{ .Values.mcp.port }}
          env:
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: MCP_HOST
              value: 0.0.0.0
            - name: MCP_PORT
              value: {{ .Values.mcp.port | quote }}
            - name: MCP_API_URL
              value: http://data-ingestion:{{ .Values.service.port }}
            - name: MCP_ALLOWED_ROOTS
              value: /data
            - name: MCP_AUTH_ENABLED
              value: "true"
            - name: MCP_RESOURCE_URL
              value: {{ .Values.mcp.resourceURL | quote }}
            - name: OAUTH_ISSUER_URL
              value: {{ .Values.auth.publicIssuerURL | quote }}
            - name: DATA_INGESTION_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.internalTokenKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /data
      volumes:
        - name: cache
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: data-ingestion-files
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
